<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>2Click MoM — बातचीत</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/conversations.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">2Click</span>
      <span class="brand-sub">MoM · बातचीत</span>
    </div>
    <p class="brand-tag">फोन कॉल, मीटिंग और वॉइस नोट — एक जगह</p>
  </header>

  <main class="shell">
    <label class="search" for="q">
      <span class="search-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </span>
      <input id="q" type="search" placeholder="Search any conversation, name, or keyword…" autocomplete="off" />
    </label>

    <div id="feed" class="feed" role="list"></div>
    <p id="empty" class="empty" hidden>कोई बातचीत नहीं मिली।</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/conversations.js"></script>
</body>
</html>
