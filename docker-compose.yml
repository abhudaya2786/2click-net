# BuildEco Group — owner-controlled stack (API + Mongo). No Emergent host required.
# Usage:
#   cp backend/.env.example backend/.env   # set ADMIN_* JWT_SECRET CORS_ORIGINS
#   docker compose up -d --build
# API: http://localhost:8001/api/

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - be_mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-buildecogroup_db}
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  be_mongo_data:
